<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">

<title>H360</title>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* 全体のベースフォントをFuturaに設定！ */
    font-family: "Futura", "Futura PT", "Helvetica Neue", Arial, sans-serif;
}
.main-box {
    width: 90%;
    max-width: 750px;
    margin: 0 auto;
    text-align: center;
}
@keyframes hueRotateFull {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}
.logo-svg {
    width: 100%;
    max-width: 800px; 
    height: auto;
    margin: 0 auto 35px auto;
    display: block;
    animation: hueRotateFull 20s infinite linear;
}
.concept {
    font-weight: 500;
    font-size: 1.1rem;
    color: #000000;
    margin: 0 0 35px 0;
    letter-spacing: 0.04em;
}
.sub-group {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    text-align: left;
}
.soon {
    font-weight: 500;
    font-size: 0.9rem;
    color: #000000;
    letter-spacing: 0.04em;
    text-align: right;
    margin-bottom: 25px;
}
.contact-wrap {
    text-align: center;
}
.contact {
    font-weight: 500;
    font-size: 0.95rem;
    display: inline-block;
}
.contact a {
    color: #000000;
    text-decoration: none;
    border-bottom: 1px solid #000000;
    padding-bottom: 1px;
}
.contact a:hover {
    opacity: 0.6;
}
</style>
</head>
